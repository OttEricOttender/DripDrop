version: '3.9'

# HydroCalc compose stack.
#
# - database-service: PostGIS with ETAK seed data (unchanged from v0.1.x).
# - main-service: legacy Flask app, kept alive during the FastAPI migration
#   so existing demos and Cypress tests keep working. Removed at end of Phase 3.
# - backend-service: new FastAPI app (v0.2.0+). Hosts the production API.
#
# Named volume ``hydro_preprocessed`` holds the pre-clipped per-valgla DEM /
# flow-dir / flow-acc rasters generated by scripts/preprocess.py. It persists
# across rebuilds so the ~30 min preprocessing only runs once per host.

services:
  database-service:
    build:
      context: ./
      dockerfile: docker/db/Dockerfile
    image: postgis-image
    container_name: postgis-container
    env_file:
      - db.env
    ports:
      # Host port 5434 chosen to avoid clashing with local postgres installs.
      - "5434:5432"
    expose:
      - 5432
    volumes:
      - ./data/kolvikud:/data
      - ./initscripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro -d hydro"]
      interval: 30s
      retries: 5
      timeout: 10s

  # ---- Legacy Flask service (will be removed at end of Phase 3) -----------
  main-service:
    build:
      context: ./
      dockerfile: docker/main/Dockerfile
    image: main-image
    container_name: main-container
    env_file:
      - db.env
    volumes:
      - ./scripts:/hydro/scripts
      - ./app:/hydro/app
      - ./data:/hydro/data
      - hydro_preprocessed:/hydro/data/preprocessed
    ports:
      - "5001:5000"
    depends_on:
      database-service:
        condition: service_healthy
    restart: on-failure

  # ---- New FastAPI service ------------------------------------------------
  backend-service:
    build:
      context: ./
      dockerfile: docker/backend/Dockerfile
    image: hydrocalc-backend
    container_name: hydrocalc-backend
    env_file:
      - db.env
    environment:
      HYDROCALC_DATA_DIR: /hydro/data
      HYDROCALC_PREPROCESSED_DIR: /hydro/data/preprocessed
      # Restrict CORS to the frontend origin in the compose stack.
      HYDROCALC_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    volumes:
      - ./backend:/hydro/backend
      - ./data:/hydro/data
      - hydro_preprocessed:/hydro/data/preprocessed
    ports:
      - "8000:8000"
    depends_on:
      database-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\", timeout=2).status == 200 else 1)'"]
      interval: 30s
      retries: 5
      timeout: 5s

  # ---- React + Vite frontend (dev hot-reload) ------------------------------
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hydrocalc-frontend-dev
    environment:
      VITE_API_BASE_URL: http://backend-service:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend-service
    profiles:
      - dev

  # ---- React + Vite frontend (production nginx) ----------------------------
  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hydrocalc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-service
    profiles:
      - prod

volumes:
  hydro_preprocessed:
    name: hydrocalc_preprocessed
