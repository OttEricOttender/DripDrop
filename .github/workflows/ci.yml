name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # --------------------------------------------------------------------------
  # Python lint
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.6.9 black==24.10.0

      - name: ruff check
        run: ruff check backend/ tests/

      - name: black --check
        run: black --check backend/ tests/

  # --------------------------------------------------------------------------
  # mypy type-check
  # --------------------------------------------------------------------------
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements-pip.txt

      - name: mypy
        run: mypy backend/

  # --------------------------------------------------------------------------
  # Python tests
  # --------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        # GIS packages (GDAL/rasterio/geopandas/pysheds) require system libs
        # that are unavailable in the standard CI runner.  We install only
        # the pure-Python subset so the science + reporting tests can run.
        # Tests that need GIS data are marked @pytest.mark.gis and skipped.
        run: |
          pip install \
            fastapi==0.115.0 \
            uvicorn==0.32.0 \
            pydantic==2.9.2 \
            pydantic-settings==2.5.2 \
            python-multipart==0.0.12 \
            httpx==0.27.2 \
            python-dotenv==1.0.1 \
            reportlab==4.5.1 \
            pytest==8.3.3 \
            pytest-cov==5.0.0 \
            pytest-asyncio==0.24.0

      - name: pytest (excluding GIS + slow tests)
        run: |
          PYTHONPATH=. python -m pytest tests/ \
            -m "not gis and not slow" \
            --ignore=tests/test_phase0_foundation.py \
            -q --tb=short

  # --------------------------------------------------------------------------
  # Frontend build
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build
